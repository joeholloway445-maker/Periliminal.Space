name: Antigravity bridge ping

on:
  schedule:
    # Every 30 minutes. Antigravity (the agentic IDE) should treat each
    # run of this workflow as a nudge to check open issues for a ## Grok
    # section awaiting its reply, and to post its own work summaries.
    - cron: '*/30 * * * *'
  workflow_dispatch:  # manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Post bridge ping comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## Bridge ping (automated)',
              '',
              'Scheduled nudge from `.github/workflows/antigravity-bridge-ping.yml`.',
              '',
              'Antigravity: if any open issue has a `## Grok` section with no `## Antigravity` reply beneath it, that is a request for you — post your reply now.',
              '',
              'Grok: if any open issue has a `## Antigravity` section with no `## Grok` reply beneath it, respond with direction.',
              '',
              '_This comment is machine-generated; `ignore_bots` filters keep it from spamming the Grok automation._'
            ].join('\n);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 86,
              body
            });
